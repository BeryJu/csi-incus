apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "csi-incus.fullname" . }}-node
  labels: {{- include "csi-incus.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "csi-incus.node.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "csi-incus.node.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "csi-incus.fullname" . }}-node
      hostPID: true
      nodeSelector: {{- .Values.node.nodeSelector | toYaml | nindent 8 }}
      tolerations: {{- .Values.node.tolerations | toYaml | nindent 8 }}
      affinity: {{- .Values.node.affinity | toYaml | nindent 8 }}
      containers:
        - name: driver
          image: {{ include "csi-incus.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
          env:
            # A pod's hostname is its pod name, not the Kubernetes Node's
            # name — NodeGetInfo needs the latter, since
            # ControllerPublishVolume uses it directly as the Incus
            # instance name to attach to.
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext:
            privileged: true
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: pods-mount-dir, mountPath: /var/lib/kubelet, mountPropagation: Bidirectional}
            - {name: dev-dir, mountPath: /dev}
          resources: {{- .Values.node.resources | toYaml | nindent 12 }}
        - name: node-driver-registrar
          image: "{{ .Values.node.sidecars.nodeDriverRegistrar.image }}:{{ .Values.node.sidecars.nodeDriverRegistrar.tag }}"
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/{{ .Values.driverName }}/csi.sock
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: registration-dir, mountPath: /registration}
      volumes:
        - name: socket-dir
          hostPath: {path: /var/lib/kubelet/plugins/{{ .Values.driverName }}, type: DirectoryOrCreate}
        - name: registration-dir
          hostPath: {path: /var/lib/kubelet/plugins_registry, type: Directory}
        - name: pods-mount-dir
          hostPath: {path: /var/lib/kubelet, type: Directory}
        - name: dev-dir
          hostPath: {path: /dev, type: Directory}
