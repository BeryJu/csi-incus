{{- $secretName := printf "%s-incus-tls" (include "csi-incus.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $clientCert := .Values.incus.tls.clientCert }}
{{- $clientKey := .Values.incus.tls.clientKey }}
{{- if and (not $clientCert) (not $clientKey) }}
  {{- if $existing }}
    {{- $clientCert = index $existing.data "client-cert" | b64dec }}
    {{- $clientKey = index $existing.data "client-key" | b64dec }}
  {{- else }}
    {{- /* Generated once and kept via the lookup above on every later
           upgrade — see NOTES.txt for how to register it with Incus. */}}
    {{- $cert := genSelfSignedCert (printf "%s-controller" (include "csi-incus.fullname" .)) nil nil 3650 }}
    {{- $clientCert = $cert.Cert }}
    {{- $clientKey = $cert.Key }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "csi-incus.labels" . | nindent 4 }}
type: Opaque
data:
  addr: {{ .Values.incus.addr | b64enc }}
  client-cert: {{ $clientCert | b64enc }}
  client-key: {{ $clientKey | b64enc }}
  {{- if .Values.incus.tls.serverCert }}
  server-cert: {{ .Values.incus.tls.serverCert | b64enc }}
  {{- end }}
