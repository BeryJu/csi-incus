{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "csi-incus.fullname" . }}-controller-metrics
  labels: {{- include "csi-incus.labels" . | nindent 4 }}
spec:
  selector: {{- include "csi-incus.controller.selectorLabels" . | nindent 4 }}
  ports:
    - {name: provisioner, port: 8081, targetPort: 8081}
    - {name: attacher, port: 8082, targetPort: 8082}
    - {name: snapshotter, port: 8083, targetPort: 8083}
    - {name: resizer, port: 8084, targetPort: 8084}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "csi-incus.fullname" . }}-controller
  labels:
    {{- include "csi-incus.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "csi-incus.labels" . | nindent 6 }}
  endpoints:
    - {port: provisioner, interval: {{ .Values.metrics.serviceMonitor.interval }}}
    - {port: attacher, interval: {{ .Values.metrics.serviceMonitor.interval }}}
    - {port: snapshotter, interval: {{ .Values.metrics.serviceMonitor.interval }}}
    - {port: resizer, interval: {{ .Values.metrics.serviceMonitor.interval }}}
{{- end }}
{{- end }}
