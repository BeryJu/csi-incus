# Talks to the Incus API over the network, so it can run anywhere in the
# cluster (unlike the node plugin, which must run on the instance it's
# attaching volumes to). Needs a Secret named "incus-credentials" in
# kube-system with keys: addr, client-cert, client-key, and optionally
# server-cert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-incus-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: csi-incus-controller}
  template:
    metadata:
      labels: {app: csi-incus-controller}
    spec:
      serviceAccountName: csi-incus-controller
      containers:
        - name: driver
          image: ghcr.io/beryju/csi-incus:latest
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
          env:
            - name: INCUS_ADDR
              valueFrom: {secretKeyRef: {name: incus-credentials, key: addr}}
            - name: INCUS_CLIENT_CERT
              value: /incus-tls/client-cert
            - name: INCUS_CLIENT_KEY
              value: /incus-tls/client-key
            - name: INCUS_SERVER_CERT
              value: /incus-tls/server-cert
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: incus-tls, mountPath: /incus-tls, readOnly: true}
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
          args: ["--csi-address=/csi/csi.sock", "--leader-election"]
          volumeMounts: [{name: socket-dir, mountPath: /csi}]
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.8.0
          args: ["--csi-address=/csi/csi.sock", "--leader-election"]
          volumeMounts: [{name: socket-dir, mountPath: /csi}]
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
          args: ["--csi-address=/csi/csi.sock", "--leader-election"]
          volumeMounts: [{name: socket-dir, mountPath: /csi}]
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.13.1
          args: ["--csi-address=/csi/csi.sock", "--leader-election"]
          volumeMounts: [{name: socket-dir, mountPath: /csi}]
      volumes:
        - {name: socket-dir, emptyDir: {}}
        - name: incus-tls
          secret:
            secretName: incus-credentials
            items:
              - {key: client-cert, path: client-cert}
              - {key: client-key, path: client-key}
              - {key: server-cert, path: server-cert}
